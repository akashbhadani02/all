<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direct Links</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111827;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= PASSWORD SCREEN ================= */

#passwordScreen {
    position: fixed;
    inset: 0;
    background: #111827;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 99999;
}

.password-box {
    width: 90%;
    max-width: 380px;

    background: #1f2937;
    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 0 30px rgba(79,70,229,0.35),
        0 20px 60px rgba(0,0,0,0.6);

    text-align: center;
}

.password-box h2 {
    color: white;
    margin-top: 0;
    margin-bottom: 10px;
}

.password-box p {
    color: #9ca3af;
    margin-bottom: 20px;
}

.password-box input {
    width: 100%;
    padding: 14px;

    border: 1px solid #4b5563;
    border-radius: 10px;

    background: #111827;
    color: white;

    outline: none;
    font-size: 16px;

    margin-bottom: 12px;
}

.password-box input:focus {
    border-color: #6366f1;
}

.password-box button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #4f46e5;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.password-box button:hover {
    background: #6366f1;
}

#error {
    color: #f87171;
    font-size: 14px;
    margin-top: 12px;
    display: none;
}

/* ================= MAIN LINKS ================= */

#mainContent {
    display: none;
    width: 100%;
    justify-content: center;
}

.link-box {
    width: 90%;
    max-width: 420px;

    background: #1f2937;
    padding: 25px;

    border-radius: 20px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.link-box h2 {
    color: white;
    text-align: center;
    margin: 0 0 20px;
}

.link-box a {
    display: block;

    text-decoration: none;
    text-align: center;

    color: white;
    background: #374151;

    padding: 15px;
    margin: 10px 0;

    border-radius: 12px;

    font-size: 17px;
    font-weight: bold;

    transition: 0.2s;
}

.link-box a:hover {
    background: #4f46e5;
    transform: translateY(-2px);
}
</style>
</head>

<body>

<!-- ================= PASSWORD ================= -->

<div id="passwordScreen">

    <div class="password-box">

        <h2>🔐 Protected Page</h2>

        <p>Enter password to continue</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter Password"
            autocomplete="off"
        >

        <button onclick="checkPassword()">
            🔓 Unlock
        </button>

        <div id="error">
            ❌ Wrong password
        </div>

    </div>

</div>


<!-- ================= MAIN CONTENT ================= -->

<div id="mainContent">

<div class="link-box">

    <h2>🔗 My Links</h2>

    <a href="https://akashbhadani02.github.io/Akash-bhadani/" target="_blank">

<script>

/* ================= PASSWORD ================= */

const PASSWORD = "deoxy";

function checkPassword() {

    const input = document.getElementById("passwordInput");
    const error = document.getElementById("error");

    if (input.value === PASSWORD) {

        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "flex";

        sessionStorage.setItem("linkPageUnlocked", "true");

    } else {

        error.style.display = "block";

        input.value = "";
        input.focus();
    }
}


/* ENTER KEY */

document.getElementById("passwordInput").addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        checkPassword();
    }

});


/* ================= DEVTOOLS / INSPECT BLOCK ================= */

/* Right Click */
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
});


/* Keyboard Shortcuts */
document.addEventListener("keydown", function(e) {

    /* F12 */
    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    /* Ctrl + Shift + I */
    if (
        e.ctrlKey &&
        e.shiftKey &&
        e.key.toLowerCase() === "i"
    ) {
        e.preventDefault();
        return false;
    }

    /* Ctrl + Shift + J */
    if (
        e.ctrlKey &&
        e.shiftKey &&
        e.key.toLowerCase() === "j"
    ) {
        e.preventDefault();
        return false;
    }

    /* Ctrl + Shift + C */
    if (
        e.ctrlKey &&
        e.shiftKey &&
        e.key.toLowerCase() === "c"
    ) {
        e.preventDefault();
        return false;
    }

    /* Ctrl + U */
    if (
        e.ctrlKey &&
        e.key.toLowerCase() === "u"
    ) {
        e.preventDefault();
        return false;
    }

});


/* ================= DEVTOOLS DETECTION ================= */

setInterval(function() {

    const threshold = 160;

    if (
        window.outerWidth - window.innerWidth > threshold ||
        window.outerHeight - window.innerHeight > threshold
    ) {

        document.body.innerHTML = `
            <div style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#111827;
                color:white;
                font-family:Arial;
                text-align:center;
            ">
                <div>
                    <h1>⚠️ Access Blocked</h1>
                    <p>Please close Developer Tools and refresh the page.</p>
                </div>
            </div>
        `;

    }

}, 1000);


/* ================= SESSION ================= */

/* Same browser tab/session ma password fari na mange */
if (sessionStorage.getItem("linkPageUnlocked") === "true") {

    document.getElementById("passwordScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "flex";

}

</script>

</body>
