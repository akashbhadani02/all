<title>Direct Links</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #111827;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Popup-style box */
.link-box {
    width: 90%;
    max-width: 420px;

    background: #1f2937;
    padding: 25px;

    border-radius: 20px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Title */
.link-box h2 {
    color: white;
    text-align: center;
    margin: 0 0 20px;
}

/* Direct Link */
.link-box a {
    display: block;

    text-decoration: none;
    text-align: center;

    color: white;
    background: #374151;

    padding: 15px;
    margin: 10px 0;

    border-radius: 12px;

    font-size: 17px;
    font-weight: bold;

    transition: 0.2s;
}

/* Hover */
.link-box a:hover {
    background: #4f46e5;
    transform: translateY(-2px);
}
</style>
